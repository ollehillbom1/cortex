# Production example. Training data lives in each user's browser (IndexedDB).
# The volume below only holds end-to-end-encrypted sync blobs for households
# that opt in to device sync — safe to skip if nobody enables sync.
services:
  cortex:
    build: .
    image: cortex:latest
    container_name: cortex
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    # Optional AI phrasing of insights: uncomment and point at a model you run
    # yourself. Without these the feature does not exist. See PRIVACY.md.
    #   - COACH_API_BASE=http://host.docker.internal:11434/v1
    #   - COACH_MODEL=llama3.2
    # Keep any key out of this file — put it in .env and reference it here:
    # env_file:
    #   - .env
    volumes:
      - cortex-sync:/app/data
    # Resource-conscious defaults suitable for a Raspberry Pi 5.
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cortex-sync:
