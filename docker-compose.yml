# Production example. All training data lives in each user's browser
# (IndexedDB), so the container itself is stateless — no volumes required.
services:
  cortex:
    build: .
    image: cortex:latest
    container_name: cortex
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    # Resource-conscious defaults suitable for a Raspberry Pi 5.
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
