name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile enforced)
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end tests (mobile viewport)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npx playwright test --project=mobile-chromium
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The primary target is an iPhone and the run above is Chromium at
      # iPhone dimensions, which shares nothing with Safari's engine. WebKit
      # started non-blocking ("find out what it says") and was promoted to
      # REQUIRED on 2026-08-02 after nine consecutive green step runs — a
      # WebKit failure now fails the job, which is the point: Safari's engine
      # is what the primary target actually runs.
      - name: Install Playwright webkit
        run: npx playwright install --with-deps webkit
      - name: Run e2e tests on WebKit
        # One paced second attempt of only the failures. WebKit on shared
        # runners intermittently starves for minutes at a stretch — observed
        # three times in two days as timeouts across UNRELATED tests, each
        # time green on a plain rerun — which outlasts Playwright's own
        # per-test retries (they fire seconds apart, inside the same
        # starvation window). The pause gives the runner a different moment;
        # --last-failed keeps the second attempt honest and fast. A real
        # regression fails twice and still fails the job.
        run: |
          rm -rf .sync-test-data
          npx playwright test --project=webkit-mobile || {
            echo "::warning::WebKit run failed; retrying only the failures after a pause (known runner-starvation flake)"
            sleep 90
            rm -rf .sync-test-data
            npx playwright test --project=webkit-mobile --last-failed
          }
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_WEBKIT: "1"
      # always(), not failure(): a green WebKit report is still worth reading
      # — the offline tests are skipped there with their reason attached, and
      # the report is where that shows.
      - name: Upload WebKit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker build (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          # Both architectures on PRs too. Building arm64 only after merge hid
          # a broken Raspberry Pi image twice: the emulated build crashed while
          # the amd64 build a PR did run passed cleanly.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
