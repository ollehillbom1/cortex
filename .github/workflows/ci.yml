name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile enforced)
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end tests (mobile viewport)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npx playwright test --project=mobile-chromium
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The primary target is an iPhone and the run above is Chromium at
      # iPhone dimensions, which shares nothing with Safari's engine. WebKit
      # has never run against this app, so it starts non-blocking: the point
      # of this step is to find out what it says, not to fail every PR until
      # someone looks. Promote to required once it has a green run.
      - name: Install Playwright webkit
        # Non-blocking too: an apt/network failure here must not fail the job
        # that the WebKit work promised would not block anything.
        continue-on-error: true
        run: npx playwright install --with-deps webkit
      - name: Run e2e tests on WebKit (non-blocking)
        id: webkit
        continue-on-error: true
        run: |
          rm -rf .sync-test-data
          npx playwright test --project=webkit-mobile
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Summarise the WebKit result
        if: always()
        run: |
          echo "### WebKit e2e: ${{ steps.webkit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Non-blocking. Promote to required once it has a green run." >> "$GITHUB_STEP_SUMMARY"
      # if: always() — continue-on-error means the job never reaches failure()
      # state, so a failure()-gated upload never ran and the whole point of the
      # step (find out what WebKit says) produced no artifact at all.
      - name: Upload WebKit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker build (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Both architectures on PRs too. Building arm64 only after merge hid
          # a broken Raspberry Pi image twice: the emulated build crashed while
          # the amd64 build a PR did run passed cleanly.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
