name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile enforced)
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end tests (mobile viewport)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npx playwright test --project=mobile-chromium
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The primary target is an iPhone and the run above is Chromium at
      # iPhone dimensions, which shares nothing with Safari's engine. WebKit
      # started non-blocking ("find out what it says") and was promoted to
      # REQUIRED on 2026-08-02 after nine consecutive green step runs — a
      # WebKit failure now fails the job, which is the point: Safari's engine
      # is what the primary target actually runs.
      - name: Install Playwright webkit
        run: npx playwright install --with-deps webkit
      - name: Run e2e tests on WebKit
        run: |
          rm -rf .sync-test-data
          npx playwright test --project=webkit-mobile
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_WEBKIT: "1"
      # always(), not failure(): a green WebKit report is still worth reading
      # — the offline tests are skipped there with their reason attached, and
      # the report is where that shows.
      - name: Upload WebKit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker build (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          # Both architectures on PRs too. Building arm64 only after merge hid
          # a broken Raspberry Pi image twice: the emulated build crashed while
          # the amd64 build a PR did run passed cleanly.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
